name: Build EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: EXE derle
        run: pyinstaller --noconfirm --onefile --windowed --name KanatixArcade --icon assets/icon.ico --add-data "assets;assets" main.py
      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: KanatixArcade
          path: dist/KanatixArcade.exe
      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KanatixArcade.exe
          body_path: CHANGELOG.md
