name: Build EXE + APK

# main dalına her gönderimde Windows exe ve Android APK derlenir,
# engine/core.py içindeki VERSION numarasıyla (örn. v1.1.0) Releases sayfasına yüklenir.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Surum numarasini oku
        id: ver
        shell: bash
        run: echo "version=$(grep -oP '^VERSION = \"\K[^\"]+' engine/core.py)" >> "$GITHUB_OUTPUT"
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: EXE derle
        run: pyinstaller --noconfirm --onefile --windowed --name KanatixArcade --icon assets/icon.ico --add-data "assets;assets" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: KanatixArcade-exe-v${{ steps.ver.outputs.version }}
          path: dist/KanatixArcade.exe
      - name: Release olustur / guncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Kanatix Arcade v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/KanatixArcade.exe
          body_path: CHANGELOG.md
          make_latest: true

  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Surum numarasini oku
        id: ver
        run: echo "version=$(grep -oP '^VERSION = \"\K[^\"]+' engine/core.py)" >> "$GITHUB_OUTPUT"
      - name: Buildozer onbellegi
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Buildozer kur
        run: pip install --upgrade buildozer cython==0.29.36 setuptools
      - name: APK derle
        run: yes | buildozer -v android debug
      - name: APK adini duzenle
        run: cp bin/*.apk KanatixArcade.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KanatixArcade-apk-v${{ steps.ver.outputs.version }}
          path: KanatixArcade.apk
      - name: Release'e ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Kanatix Arcade v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: KanatixArcade.apk
          body_path: CHANGELOG.md

  # Emülatörde açılış testi: APK'nın açılıp açılmadığını ve hata kaydını görmek için
  apk-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Buildozer onbellegi (x86_64)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-x86-${{ hashFiles('buildozer.spec') }}
      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
      - name: Buildozer kur
        run: pip install --upgrade buildozer cython==0.29.36 setuptools
      - name: Emülatör için APK (x86_64)
        env:
          APP_ANDROID_ARCHS: x86_64
        run: yes | buildozer -v android debug
      - name: KVM ac
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulatorde ac ve kaydi al
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r bin/*.apk
            adb logcat -c
            adb shell monkey -p com.kanatix.kanatixarcade -c android.intent.category.LAUNCHER 1
            sleep 45
            adb exec-out screencap -p > emulator_ekran.png
            adb logcat -d > logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: |
            logcat.txt
            emulator_ekran.png
